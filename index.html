<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>汉字探索乐园 · 识字卡片</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    /* 基础光影渐变（顶部受光、底部偏冷，营造空间感） */
    background: radial-gradient(120% 120% at 50% -10%, #fff7e6 0%, #e8f3ff 45%, #efe6ff 100%);
    color: #3a3a5a;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }

  /* ============ 立体层次背景舞台（视差 + 光影） ============ */
  .bg-stage { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-layer { position: absolute; inset: -10%; will-change: transform; }
  /* 远景柔光团：最慢、最模糊、最淡 —— 推远景深 */
  .bg-layer.far {
    background:
      radial-gradient(40vmax 40vmax at 18% 22%, rgba(255,214,140,.55), transparent 60%),
      radial-gradient(36vmax 36vmax at 82% 30%, rgba(150,200,255,.50), transparent 60%),
      radial-gradient(44vmax 44vmax at 50% 90%, rgba(200,170,255,.45), transparent 62%);
    filter: blur(8px); opacity: .9;
  }
  /* 中景光斑：中速、中等模糊 */
  .bg-layer.mid {
    background:
      radial-gradient(14vmax 14vmax at 30% 70%, rgba(255,183,77,.35), transparent 60%),
      radial-gradient(12vmax 12vmax at 70% 58%, rgba(120,170,255,.30), transparent 60%),
      radial-gradient(10vmax 10vmax at 58% 18%, rgba(255,140,200,.28), transparent 60%);
    filter: blur(2px); opacity: .8;
  }
  /* 近景星点：最快、清晰，带高光 —— 拉近景深 */
  .bg-layer.near {
    opacity: .9;
    background-image:
      radial-gradient(3px 3px at 12% 18%, rgba(255,255,255,.95), transparent),
      radial-gradient(2px 2px at 28% 62%, rgba(255,255,255,.85), transparent),
      radial-gradient(3px 3px at 55% 38%, rgba(255,247,200,.95), transparent),
      radial-gradient(2px 2px at 78% 72%, rgba(255,255,255,.80), transparent),
      radial-gradient(3px 3px at 88% 26%, rgba(200,230,255,.95), transparent),
      radial-gradient(2px 2px at 42% 84%, rgba(255,255,255,.80), transparent);
  }
  /* 顶部光晕：模拟光源，强化光影质感 */
  .bg-light {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(80% 50% at 50% -8%, rgba(255,255,255,.85), rgba(255,255,255,0) 55%);
  }
  /* 边缘暗角：聚焦中心，增强景深 */
  .bg-vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(60,50,90,.18) 100%);
  }

  /* 内容层浮于背景之上 */
  .page {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; width: 100%;
  }

  header { text-align: center; margin-bottom: clamp(20px, 4vh, 48px); }
  header h1 {
    font-size: clamp(26px, 6vw, 44px); letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(255,255,255,.6);
  }
  header p { margin-top: 10px; font-size: clamp(14px, 3.4vw, 18px); color: #6b6b8a; }

  .entries {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(16px, 3vw, 32px); width: min(960px, 92vw);
    perspective: 1200px; /* 卡片 3D 倾斜舞台 */
  }
  @media (max-width: 680px) { .entries { grid-template-columns: 1fr; } }

  .entry {
    position: relative; display: block; text-decoration: none;
    border-radius: 22px; overflow: hidden; background: #fff;
    box-shadow: 0 18px 40px rgba(80,80,140,.22), 0 4px 12px rgba(80,80,140,.12);
    transition: transform .3s cubic-bezier(.2,.7,.3,1), box-shadow .3s ease;
    aspect-ratio: 4 / 3;
    transform-style: preserve-3d;
    animation: floaty 7s ease-in-out infinite; /* 轻微悬浮，强化立体“活”感 */
  }
  .entry:nth-child(2) { animation-delay: -3.5s; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotateX(0) rotateY(0); }
    50%      { transform: translateY(-10px) rotateX(2deg) rotateY(-1.5deg); }
  }
  .entry:hover, .entry:focus-visible {
    transform: translateY(-8px) scale(1.03) rotateX(4deg) rotateY(-2deg);
    box-shadow: 0 26px 55px rgba(80,80,140,.30), 0 6px 16px rgba(80,80,140,.16);
    outline: none; animation-play-state: paused;
  }
  .entry img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .entry .label {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 16px; font-size: clamp(16px, 3vw, 22px); font-weight: 700;
    color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.55));
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
  }
  /* 卡片左上高光，强化光影质感 */
  .entry::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.35), rgba(255,255,255,0) 40%);
    mix-blend-mode: screen;
  }

  footer { margin-top: clamp(20px, 4vh, 40px); font-size: 13px; color: #9a9ab5; text-align: center; }

  /* 尊重“减少动态效果”偏好：关闭所有视差与悬浮动画 */
  @media (prefers-reduced-motion: reduce) {
    .entry { animation: none; }
    .bg-layer { transition: none !important; }
  }
  /* 触屏设备：降低远景模糊成本（无鼠标，视差改为自动轻漂） */
  @media (hover: none) {
    .bg-layer.far { filter: blur(6px); }
  }
</style>
</head>
<body>
  <!-- 立体层次背景：远/中/近三层 + 光源 + 暗角 -->
  <div class="bg-stage" aria-hidden="true">
    <div class="bg-layer far"  data-depth="10"></div>
    <div class="bg-layer mid"  data-depth="24"></div>
    <div class="bg-layer near" data-depth="46"></div>
    <div class="bg-light"></div>
    <div class="bg-vignette"></div>
  </div>

  <div class="page">
    <header>
      <h1>🌟 汉字探索乐园</h1>
      <p>选择一个世界，开启有趣的识字之旅</p>
    </header>
    <main class="entries">
      <a class="entry" href="nature.html" aria-label="自然元素探索之旅">
        <img src="背景1.jpg" alt="自然元素探索" decoding="async">
        <span class="label">🌿 自然元素探索之旅</span>
      </a>
      <a class="entry" href="zoo.html" aria-label="动物王国探索之旅">
        <img src="背景图2.jpg" alt="动物王国探索" decoding="async">
        <span class="label">🦁 动物王国探索之旅</span>
      </a>
    </main>
    <footer>轻点卡片进入对应情境 · 适配平板与手机</footer>
  </div>

  <script>
  (function () {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return; // 尊重减少动效偏好，不做视差
    var noHover = window.matchMedia && window.matchMedia('(hover: none)').matches;
    var layers = Array.prototype.slice.call(document.querySelectorAll('.bg-layer'));
    var tx = 0, ty = 0, cx = 0, cy = 0, raf = null;

    function animate() {
      cx += (tx - cx) * 0.08; // 平滑缓动，避免突兀
      cy += (ty - cy) * 0.08;
      for (var i = 0; i < layers.length; i++) {
        var d = parseFloat(layers[i].getAttribute('data-depth')) || 0;
        // 仅用 transform（GPU 合成），不触发重排/重绘
        layers[i].style.transform = 'translate3d(' + (-cx * d) + 'px,' + (-cy * d) + 'px,0)';
      }
      if (Math.abs(tx - cx) > 0.1 || Math.abs(ty - cy) > 0.1) raf = requestAnimationFrame(animate);
      else raf = null;
    }
    function schedule() { if (!raf) raf = requestAnimationFrame(animate); }

    if (!noHover) {
      // 桌面：指针视差（被动监听 + rAF 节流）
      window.addEventListener('pointermove', function (e) {
        tx = (e.clientX / window.innerWidth  - 0.5) * 2;  // 归一化 [-1,1]
        ty = (e.clientY / window.innerHeight - 0.5) * 2;
        schedule();
      }, { passive: true });
    } else {
      // 移动端：极低成本自动轻漂，营造呼吸式景深
      var t0 = performance.now();
      (function drift() {
        var t = (performance.now() - t0) / 1000;
        tx = Math.sin(t * 0.4) * 0.5;
        ty = Math.cos(t * 0.3) * 0.4;
        schedule();
        setTimeout(drift, 60);
      })();
    }
  })();
  </script>
</body>
</html>
